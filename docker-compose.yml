# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Docker Compose Infrastructure de Production VPS 🏢
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # 1. Application PROGITPAIE (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: progitpaie-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"  # Exposé STRICTEMENT en local pour le Nginx du VPS
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - progitpaie-net

  # 2. Migrations Prisma : doivent réussir avant le démarrage de l'application
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - progitpaie-net

  # 3. Base de données PostgreSQL (réseau Docker privé uniquement)
  postgres:
    image: postgres:15-alpine
    container_name: progitpaie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=progitpaie
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=progitpaie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progitpaie -d progitpaie"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - progitpaie-net

  # 4. Cache Redis (réseau Docker privé uniquement)
  redis:
    image: redis:7-alpine
    container_name: progitpaie-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - progitpaie-net

volumes:
  postgres_data:
  redis_data:

networks:
  progitpaie-net:
    driver: bridge
