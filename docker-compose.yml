version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Docker Compose Infrastructure de Production VPS 🏢
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # 1. Application PROGITPAIE (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: progitpaie-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - progitpaie-net

  # 2. Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: progitpaie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-progitpaie}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-progitpaie}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progitpaie}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - progitpaie-net

  # 3. Cache Redis
  redis:
    image: redis:7-alpine
    container_name: progitpaie-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - progitpaie-net

volumes:
  postgres-data:
  redis-data:

networks:
  progitpaie-net:
    driver: bridge
