# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Docker Compose Infrastructure de Production VPS 🏢
# ═══════════════════════════════════════════════════════════════════════════════

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://progitpaie:progitpaie_pass_2026@postgres:5432/progitpaie?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - progitpaie-net

  # 1. Application PROGITPAIE (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: progitpaie-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://progitpaie:progitpaie_pass_2026@postgres:5432/progitpaie?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-progitpaie_jwt_secret_2026_super_secret_key_32bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-progitpaie_encryption_key_2026_super_secret_key}
      - ENCRYPTION_KEY_PREVIOUS=${ENCRYPTION_KEY_PREVIOUS:-}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - progitpaie-net

  # 2. Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: progitpaie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-progitpaie}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-progitpaie_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-progitpaie}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progitpaie}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - progitpaie-net

  # 3. Cache Redis
  redis:
    image: redis:7-alpine
    container_name: progitpaie-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - progitpaie-net

volumes:
  postgres-data:
  redis-data:

networks:
  progitpaie-net:
    driver: bridge
