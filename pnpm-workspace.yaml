packages:
  - '.'

# Scripts de build explicitement autorisés pour les dépendances natives et Prisma.
# Cette liste évite le blocage ERR_PNPM_IGNORED_BUILDS sans autoriser tous les paquets.
overrides:
  sharp: 0.35.3
  postcss: 8.5.26
  uuid: 11.1.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  prisma: true
  sharp: true
  unrs-resolver: true
