# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Configuration VHost NGINX Reverse Proxy (paie.progitpaie.com) 🌐
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name paie.progitpaie.com;

    # Redirection HTTP vers HTTPS (Certbot ajoutera sa configuration)
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        
        # En-têtes Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support WebSockets et Server-Sent Events (SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts pour l'export des bulletins et les requêtes longues
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Cache optimisé pour les ressources statiques Next.js
    location /_next/static {
        proxy_pass http://127.0.0.1:3300;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Optimisation Téléversements et Fichiers Médias
    location /uploads {
        proxy_pass http://127.0.0.1:3300;
        client_max_body_size 100M;
    }

    # Fichiers de Logs
    access_log /var/log/nginx/paie.progitpaie.com-access.log;
    error_log /var/log/nginx/paie.progitpaie.com-error.log;
}
