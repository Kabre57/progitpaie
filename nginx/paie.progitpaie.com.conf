# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Configuration VHost NGINX Reverse Proxy (paie.progitpaie.com) 🌐
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name paie.progitpaie.com;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3500;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads {
        proxy_pass http://127.0.0.1:3500;
        client_max_body_size 100M;
    }

    access_log /var/log/nginx/paie.progitpaie.com-access.log;
    error_log /var/log/nginx/paie.progitpaie.com-error.log;
}
