# ═══════════════════════════════════════════════════════════════════════════════
# PROGITPAIE — Configuration VHost NGINX Reverse Proxy (progitpaie.online) 🌐
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name progitpaie.online www.progitpaie.online paie.progitpaie.com;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Support des WebSockets Socket.io Temps-Réel
    location /api/socket/io {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3500;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads {
        proxy_pass http://127.0.0.1:3500;
        client_max_body_size 100M;
    }

    access_log /var/log/nginx/progitpaie.online-access.log;
    error_log /var/log/nginx/progitpaie.online-error.log;
}
