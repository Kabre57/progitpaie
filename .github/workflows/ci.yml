name: CI — Qualité et Tests PROGITPAIE 🧪

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://progitpaie:ci_password@localhost:5433/progitpaie_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      ENCRYPTION_KEY: ci-only-encryption-key-at-least-32chars

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: progitpaie
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: progitpaie_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U progitpaie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Generate Prisma Client
        run: pnpm prisma:generate

      - name: ✅ Validate Prisma Schema
        run: pnpm prisma:validate

      - name: 🔍 TypeScript Typecheck
        run: pnpm exec tsc --noEmit

      - name: 🧹 ESLint
        run: pnpm lint

      - name: 🧪 Jest Tests
        run: pnpm test

      - name: 🏗️ Next.js Build
        run: pnpm build
