name: Déploiement Automatique PROGITPAIE sur VPS (GitOps) 🚀

on:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Qualité et build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://progitpaie:ci_password@localhost:5433/progitpaie_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      ENCRYPTION_KEY: ci-only-encryption-key-at-least-32chars

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: progitpaie
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: progitpaie_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U progitpaie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📦 Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: 🚀 Exécution du Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.THEO_PBL_VPS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "====================================================="
            echo "🚀 Début du Déploiement PROGITPAIE via GitHub Actions"
            echo "====================================================="

            cd /home/theo_pbl/apps/progitpaie

            if [ ! -d .git ]; then
              echo "📦 Premier clonage du dépôt GitHub..."
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "🔄 Récupération des dernières modifications..."
              if [ -f .env ]; then cp .env /tmp/progitpaie.env; fi
              git fetch origin main
              git reset --hard origin/main
              if [ -f /tmp/progitpaie.env ]; then mv /tmp/progitpaie.env .env; fi
            fi

            chmod +x deploy.sh
            ./deploy.sh

            echo "====================================================="
            echo "✅ Déploiement terminé avec succès !"
            echo "====================================================="
