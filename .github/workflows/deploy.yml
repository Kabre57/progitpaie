name: Déploiement Automatique PROGITPAIE sur VPS (GitOps) 🚀

on:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Qualité et build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://progitpaie:ci-password@localhost:5432/progitpaie?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      ENCRYPTION_KEY: ci-only-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📦 Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: 🚀 Exécution du Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}       # IP VPS: 180.149.199.203
          username: ${{ secrets.VPS_USER }}   # Utilisateur: root ou ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}     # Clé privée SSH
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "====================================================="
            echo "🚀 Début du Déploiement PROGITPAIE via GitHub Actions"
            echo "====================================================="

            # 1. Aller dans le dossier de déploiement configuré sur le VPS
            cd /home/theo_pbl/apps/progitpaie

            # 2. Si le dépôt n'est pas encore cloné sur le VPS
            if [ ! -d .git ]; then
              echo "📦 Premier clonage du dépôt GitHub..."
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "🔄 Récupération des dernières modifications..."
              if [ -f .env ]; then cp .env /tmp/progitpaie.env; fi
              git fetch origin main
              git reset --hard origin/main
              if [ -f /tmp/progitpaie.env ]; then mv /tmp/progitpaie.env .env; fi
            fi

            # 3. Lancement de la construction et des conteneurs Docker
            chmod +x deploy.sh
            ./deploy.sh

            echo "====================================================="
            echo "✅ Déploiement terminé avec succès !"
            echo "====================================================="
